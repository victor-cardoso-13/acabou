<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acabou! novidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* identidade da fábrica: creme + tinta + âmbar. Layout: guia à esquerda, celular à direita; no celular de verdade, guia vira faixa no topo */
  --creme:#f7ecd8; --papel:#fffaf1; --tinta:#3b2f2a; --tinta-suave:#7a6a60;
  --ambar:#e8a33d; --ambar-forte:#b8730f; --ambar-claro:#fde6bd;
  --verde:#4f8a5b; --verde-claro:#dcefdc; --linha:#ead9bd;
  --f-titulo:"Fredoka","Nunito",system-ui,sans-serif;
  --f-texto:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--creme);color:var(--tinta);font-family:var(--f-texto);font-size:16px;
  display:flex;gap:40px;align-items:center;justify-content:center;padding:24px;}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ambar-forte);outline-offset:2px}
h1,h2,h3{font-family:var(--f-titulo);text-wrap:balance;margin:0}

/* ---------- GUIA ---------- */
.guia{width:360px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.guia .marca{font-family:var(--f-titulo);font-size:28px;font-weight:700}
.guia .sub{color:var(--tinta-suave);margin-top:-8px;line-height:1.4}
.passo-atual{background:var(--papel);border:2px solid var(--ambar);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 var(--ambar-claro)}
.passo-atual .n{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ambar-forte)}
.passo-atual h2{font-size:22px}
.passo-atual p{margin:0;line-height:1.45}
.btn-guia{background:var(--tinta);color:var(--papel);border:0;border-radius:14px;padding:12px 14px;font-weight:800}
.lista-passos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lista-passos li{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:10px;color:var(--tinta-suave);font-weight:600}
.lista-passos li .b{width:24px;height:24px;border-radius:50%;border:2px solid var(--linha);display:grid;place-items:center;font-size:13px;flex:none}
.lista-passos li.feito{color:var(--tinta)}
.lista-passos li.feito .b{background:var(--verde);border-color:var(--verde);color:#fff}
.lista-passos li.agora{background:var(--ambar-claro);color:var(--tinta)}
.lista-passos li.agora .b{border-color:var(--ambar-forte)}

/* ---------- CELULAR ---------- */
.celular{width:390px;height:min(820px,100%);border:10px solid var(--tinta);border-radius:46px;overflow:hidden;background:var(--papel);
  position:relative;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(59,47,42,.25);flex:none}
.topo{padding:18px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linha)}
.topo .tit{flex:1}
.topo h1{font-size:24px}
.topo .s{font-size:13px;color:var(--tinta-suave);font-weight:700}
.avs{display:flex}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;border:2px solid var(--papel);color:#fff}
.av.v{background:#7a5c4a}.av.a{background:#c0698a;margin-left:-8px}
.av.mercado{box-shadow:0 0 0 3px var(--verde)}
.conteudo{flex:1;overflow-y:auto;padding:14px 16px 90px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.conteudo::-webkit-scrollbar{display:none}
.abas{display:flex;border-top:1px solid var(--linha);background:var(--papel);padding:6px 6px 14px}
.abas button{flex:1;border:0;background:none;padding:8px 4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px;color:var(--tinta-suave);position:relative}
.abas button .ic{font-size:24px;line-height:1}
.abas button.on{background:var(--ambar-claro);color:var(--tinta)}
.abas .badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--ambar-forte);color:#fff;border-radius:10px;padding:0 6px;font-size:12px;line-height:18px}

/* em casa */
.busca{display:flex;gap:8px}
.busca input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:2px solid var(--linha);background:#fff;color:var(--tinta)}
.busca button{border:0;border-radius:14px;background:var(--tinta);color:var(--papel);padding:0 14px;font-weight:800}
.pulos{flex:none;position:sticky;top:-14px;z-index:2;background:var(--papel);margin:-8px -16px 0;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--linha)}
.pulos::-webkit-scrollbar{display:none}
.pulo{flex:none;border:2px solid var(--linha);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap}
#gradeCasa{flex:none;display:flex;flex-direction:column;gap:16px}
.grupo{scroll-margin-top:60px}
.grupo h3{font-size:17px;margin:0 2px 8px;font-weight:600}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{border:2px solid var(--linha);background:#fff;border-radius:18px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:100px;
  transition:transform .12s, background .2s, border-color .2s}
.item{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.item:active{transform:scale(.94)}
.item.segurando{transform:scale(.9);border-color:var(--tinta);transition:transform .5s, border-color .5s}
.item .e{font-size:30px;line-height:1.1}
.item .nm{font-weight:800;font-size:14px;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.item .tag{font-size:11px;font-weight:700;color:var(--ambar-forte);min-height:14px}
.item.falta{background:var(--ambar-claro);border-color:var(--ambar)}
.item.falta .e{animation:pula .35s}
.item.criar{border-style:dashed;border-color:var(--ambar);background:var(--papel)}
.vazio{color:var(--tinta-suave);text-align:center;margin:0}
.sugestao{background:#fff;border:2px dashed var(--ambar);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.sugestao .tx{flex:1;font-size:14px;line-height:1.35}
.sugestao .tx b{font-size:15px}
.sugestao button{border:0;background:var(--ambar);border-radius:12px;padding:10px 12px;font-weight:800}
.pill{display:inline-block;font-size:11px;font-weight:800;background:var(--tinta);color:var(--papel);border-radius:8px;padding:1px 6px;vertical-align:2px}

/* mercado */
.resumo{background:var(--tinta);color:var(--papel);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.resumo .grande{font-family:var(--f-titulo);font-size:24px;font-weight:600}
.resumo button{border:0;background:var(--ambar);color:var(--tinta);border-radius:14px;padding:14px;font-weight:800;font-size:18px}
.aovivo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--verde)}
.aovivo i{width:10px;height:10px;border-radius:50%;background:var(--verde);animation:pisca 1.4s infinite}
.barra{height:12px;background:var(--linha);border-radius:8px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:8px;transition:width .4s}
.secao h3{font-size:17px;display:flex;align-items:center;gap:8px;margin:0 2px 8px;line-height:1.2}
.secao h3 small{display:block;font-family:var(--f-texto);font-size:12px;color:var(--tinta-suave);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.num{background:var(--ambar);color:var(--tinta);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:14px;font-weight:800;flex:none;font-family:var(--f-texto)}
.linhas{display:flex;flex-direction:column;gap:8px}
.linha{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--linha);border-radius:16px;padding:12px;width:100%;text-align:left;transition:opacity .3s, transform .3s;min-height:60px}
.linha .ck{width:30px;height:30px;border-radius:50%;border:3px solid var(--linha);flex:none;display:grid;place-items:center;color:#fff;font-weight:900}
.linha .e{font-size:26px}
.linha .tx{flex:1;display:flex;flex-direction:column}
.linha .tx b{font-size:18px}
.linha .tx small{color:var(--tinta-suave);font-weight:700;font-size:12px}
.linha .tx small.chegada{color:var(--ambar-forte)}
.linha .nt{border:0;background:none;color:var(--tinta-suave);font-weight:800;font-size:13px;padding:8px 4px;text-decoration:underline}
.linha.prev{opacity:.75}
.linha.no-carrinho{background:var(--verde-claro);border-color:transparent}
.linha.no-carrinho .ck{background:var(--verde);border-color:var(--verde)}
.linha.no-carrinho b{text-decoration:line-through;color:var(--tinta-suave)}
.linha.sem{background:transparent;border-style:dashed}
.linha.chegou{animation:chegou 1.6s}
.rotulo-grupo{font-weight:800;font-size:14px;color:var(--tinta-suave);margin:0 2px 6px}
.fixo{position:absolute;left:16px;right:16px;bottom:92px}
.fixo button{width:100%;border:0;background:var(--tinta);color:var(--papel);border-radius:16px;padding:16px;font-weight:800;font-size:18px;box-shadow:0 6px 18px rgba(59,47,42,.3)}

/* organizar */
.segmento{display:flex;background:var(--linha);border-radius:14px;padding:4px;gap:4px}
.segmento button{flex:1;border:0;background:none;border-radius:11px;padding:10px 6px;font-weight:800;font-size:14px;color:var(--tinta-suave)}
.segmento button.on{background:var(--papel);color:var(--tinta);box-shadow:0 1px 3px rgba(59,47,42,.15)}
.explica{margin:0;line-height:1.45;color:var(--tinta-suave)}
.cor{background:#fff;border:2px solid var(--linha);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;transition:background .4s}
.cor.mexeu{background:var(--ambar-claro)}
.cor .l1{display:flex;align-items:center;gap:8px}
.emo{width:46px;height:46px;border-radius:12px;border:2px dashed var(--linha);background:var(--papel);font-size:24px;flex:none;padding:0}
.cor .nm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.ren{border:0;background:none;padding:0;text-align:left;font-weight:800;font-size:16px;line-height:1.2}
.ren i{font-style:normal;color:var(--ambar-forte);font-size:13px}
.ver{border:0;background:none;padding:2px 0 0;font-size:13px;color:var(--tinta-suave);font-weight:700;text-decoration:underline}
.seta{width:44px;height:44px;border-radius:12px;border:2px solid var(--linha);background:var(--papel);font-size:16px;font-weight:900;flex:none}
.seta:disabled{opacity:.3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--linha);background:var(--papel);border-radius:999px;padding:6px 10px;font-weight:700;font-size:14px}
.chip.sel{background:var(--ambar-claro);border-color:var(--ambar-forte)}
.link{border:0;background:none;padding:6px 0;color:#a33;font-weight:800;text-decoration:underline;font-size:14px;align-self:flex-start}
.novo{border:2px dashed var(--ambar);background:var(--papel);border-radius:16px;padding:14px;font-weight:800;font-size:16px}
.opcao{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--linha);border-radius:16px;padding:14px}
.opcao input{width:26px;height:26px;accent-color:var(--verde);flex:none;margin:0}
.opcao label{line-height:1.4}

/* aviso e folha */
.aviso{position:absolute;left:16px;right:16px;bottom:92px;transition-property:opacity,transform,bottom;background:var(--tinta);color:var(--papel);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700;
  transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s;z-index:5}
.aviso.on{transform:none;opacity:1;pointer-events:auto}
.aviso span{flex:1}
.aviso button{border:0;background:none;color:var(--ambar);font-weight:800;text-decoration:underline;padding:4px}
.veu{position:absolute;inset:0;background:rgba(59,47,42,.45);display:flex;align-items:flex-end;z-index:10}
.folha{background:var(--papel);width:100%;max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px 28px;display:flex;flex-direction:column;gap:12px;animation:sobe .25s}
.folha h2{font-size:22px}
.folha p{margin:0;line-height:1.45}
.folha .chips .chip{font-size:15px;padding:9px 12px}
.folha .rot{font-weight:800;color:var(--tinta-suave);font-size:14px;margin-top:4px}
.folha input[type=text]{font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--linha);background:#fff;color:var(--tinta);width:100%;min-width:0}
.folha .ok{border:0;background:var(--tinta);color:var(--papel);border-radius:14px;padding:14px;font-weight:800;font-size:17px}
.folha .ok.perigo{background:#a33}
.folha .cancela{border:0;background:none;font-weight:800;color:var(--tinta-suave);padding:6px}
.campo-item{display:flex;gap:10px;align-items:center}
.campo-item .emo{width:60px;height:60px;font-size:34px}
.teclado{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--ambar);border-radius:16px;padding:10px}
.folha .teclado input[type=text]{width:64px;min-width:64px;height:60px;padding:0;font-size:32px;text-align:center;border:2px dashed var(--linha);border-radius:12px;background:var(--papel);flex:none;caret-color:transparent}
.teclado span{flex:1;min-width:0;font-size:14px;line-height:1.35}
.teclado small{display:block;color:#a33;font-weight:800}
.emojis h3{font-size:15px;color:var(--tinta-suave);margin:6px 0 6px}
.emojis .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.emojis .g button{border:0;background:#fff;border-radius:10px;font-size:26px;aspect-ratio:1;padding:0}
.emojis .g button.sel{background:var(--ambar-claro);box-shadow:inset 0 0 0 2px var(--ambar-forte)}

/* destaque do guia */
.alvo{position:relative;animation:alvo 1.3s infinite;z-index:1}
@keyframes alvo{0%,100%{box-shadow:0 0 0 0 rgba(232,163,61,.9)}50%{box-shadow:0 0 0 7px rgba(232,163,61,.35)}}
@keyframes pula{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pisca{50%{opacity:.3}}
@keyframes chegou{0%{background:var(--ambar);transform:translateX(30px)}100%{background:#fff}}
@keyframes sobe{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:820px){
  body{flex-direction:column;gap:10px;padding:10px;align-items:stretch;justify-content:flex-start}
  .guia{width:auto;flex:none;overflow:visible}
  .guia .marca,.guia .sub,.lista-passos{display:none}
  .passo-atual{padding:12px 14px;gap:6px;box-shadow:none}
  .passo-atual h2{font-size:18px}
  .passo-atual p{font-size:15px}
  .celular{width:100%;height:auto;flex:1;min-height:0;border-width:4px;border-radius:26px}
}

/* novidades v4: vários mercados, aviso acima das abas, pergunta para a IA */
.mercs{display:flex;gap:6px;flex-wrap:wrap}
.merc{border:2px solid var(--linha);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px}
.merc.on{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.merc.mais{border-style:dashed;border-color:var(--ambar);background:var(--papel)}
.resumo .mercs .merc{background:transparent;border-color:rgba(255,250,241,.35);color:var(--papel)}
.resumo .mercs .merc.on{background:var(--papel);color:var(--tinta);border-color:var(--papel)}
.resumo .onde{font-size:14px;font-weight:700;opacity:.85;margin-top:-6px}
.linha .qual{border:0;background:var(--ambar-claro);color:var(--tinta);font-weight:800;font-size:13px;padding:8px 10px;border-radius:10px}
.ia{background:#fff;border:2px dashed var(--ambar);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ia .tx{font-size:15px;line-height:1.4}
.ia .tx b{font-family:var(--f-titulo);font-size:18px;font-weight:600}
.ia button{border:0;background:var(--ambar);border-radius:14px;padding:12px;font-weight:800;font-size:16px}
.pergunta{width:100%;min-height:220px;font:inherit;font-size:14px;line-height:1.45;padding:12px;border-radius:14px;border:2px solid var(--linha);background:#fff;color:var(--tinta);resize:none}
.folha .nota{font-size:13px;color:var(--tinta-suave);line-height:1.4}
.mini{display:flex;gap:4px;background:var(--linha);border-radius:12px;padding:3px}
.mini button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-weight:800;font-size:13px;color:var(--tinta-suave)}
.mini button.on{background:var(--papel);color:var(--tinta);box-shadow:0 1px 3px rgba(59,47,42,.15)}
.troca{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--linha);border-radius:16px;padding:12px}
.troca input{width:26px;height:26px;accent-color:var(--verde);flex:none;margin:0}
.troca label{line-height:1.35}
.links{display:flex;gap:16px;flex-wrap:wrap}
.links .link{color:var(--tinta-suave)}
.links .link.perigo{color:#a33}
.linha .tx small.preco{color:var(--verde);font-weight:800}
.linha .tx small.preco.outro{color:var(--ambar-forte)}
.ia .botoes{display:flex;gap:8px}
.ia .botoes button{flex:1}
.ia .botoes button.claro{background:var(--papel);border:2px solid var(--ambar)}
.ia .quando{font-size:13px;color:var(--tinta-suave);font-weight:700}
.folha .erro{color:#a33;font-weight:800;font-size:14px;min-height:0}
.rotulo-grupo.outro{color:var(--ambar-forte)}
.cartao-preco{padding:10px 12px;gap:6px}
.pl{display:flex;align-items:center;gap:8px;border-top:1px solid var(--linha);padding-top:6px}
.pl .pm{width:104px;flex:none;font-weight:800;font-size:14px}
.pl .pv{flex:1;min-width:0;font-size:15px;display:flex;flex-direction:column}
.pl .pv small{color:var(--tinta-suave);font-weight:700;font-size:12px}
.pl .vazio-p{color:var(--tinta-suave);font-weight:700;font-size:14px}
.pl.melhor .pv b{color:var(--verde)}
.pl.velho{opacity:.6}
.cartao-preco .qual{border:0;background:var(--ambar-claro);color:var(--tinta);font-weight:800;font-size:14px;padding:9px 12px;border-radius:10px;flex:none}
.selo{background:var(--verde-claro);color:var(--verde);font-weight:800;font-size:12px;border-radius:8px;padding:3px 7px;flex:none}
.abas button{font-size:12px}
</style>
</head>
<body>

<aside class="guia" aria-label="Guia do mock">
  <div class="marca">Acabou! · novidades</div>
  <div class="sub">Mock das mudanças: vários mercados, aviso acima das abas e "onde está mais barato?". Siga os passos e toque no celular ao lado. Nada aqui é salvo.</div>
  <div class="passo-atual" id="passo"></div>
  <ol class="lista-passos" id="passos"></ol>
</aside>

<main class="celular" id="cel" aria-label="App no celular">
  <header class="topo">
    <div class="tit"><h1 id="titulo">Em casa</h1><div class="s" id="subtitulo"></div></div>
    <div class="avs"><div class="av v" id="avV" title="Victor">V</div><div class="av a" title="Ana">A</div></div>
  </header>
  <section class="conteudo" id="conteudo"></section>
  <div id="fixo"></div>
  <nav class="abas" id="abas">
    <button data-tab="casa"><span class="ic">🏠</span>Em casa</button>
    <button data-tab="mercado"><span class="ic">🛒</span>Mercado<span class="badge" id="badge"></span></button>
    <button data-tab="precos"><span class="ic">🏷️</span>Preços</button>
    <button data-tab="organizar"><span class="ic">🧭</span>Organizar</button>
  </nav>
  <div class="aviso" id="aviso" role="status"><span id="avisoTx"></span><button id="avisoBt"></button></div>
  <div id="folha"></div>
</main>

<script src="catalogo.js"></script>
<script>
const C = window.CATALOGO;

/* ---------- aviso: sempre ACIMA das abas (e acima do "Terminar compras" quando ele aparece) ---------- */
let tAviso;
function posicionar(){
  const abas = $('abas').offsetHeight;
  const fx = document.querySelector('.fixo');
  if(fx) fx.style.bottom = (abas + 10) + 'px';
  $('aviso').style.bottom = (abas + 10 + (fx ? fx.offsetHeight + 10 : 0)) + 'px';
}
function aviso(tx, rotulo, acao){
  $('avisoTx').textContent = tx;
  const b = $('avisoBt'); b.textContent = rotulo||''; b.style.display = rotulo?'':'none';
  b.onclick = ()=>{ acao&&acao(); $('aviso').classList.remove('on'); render(); };
  posicionar();
  $('aviso').classList.add('on');
  clearTimeout(tAviso); tAviso = setTimeout(()=>$('aviso').classList.remove('on'), 3200);
}

/* ---------- Em casa ---------- */
function tile(i){
  return `<button class="item ${i.falta?'falta':''}" data-id="${i.id}" aria-pressed="${i.falta}"><span class="e">${i.ic}</span><span class="nm">${esc(i.nome)}</span><span class="tag">${i.falta?`${esc(i.quem)} · ${esc(i.hora)}`:''}</span></button>`;
}
function telaCasa(){
  const n = faltando().length;
  $('subtitulo').textContent = n ? `${n} ${n===1?'coisa':'coisas'} na lista dos dois` : 'Nada faltando';
  $('conteudo').innerHTML =
    `<form class="busca" id="formBusca"><input id="busca" autocomplete="off" placeholder="Acabou o quê?" aria-label="Acabou o quê?" value="${esc(S.filtro)}"><button>Pôr na lista</button></form>
     <div class="pulos" id="pulos">${S.categorias.map(c=>`<button class="pulo" data-pula="${c.id}">${c.ic} ${esc(c.nome)}</button>`).join('')}</div>
     <div id="gradeCasa"></div>`;
  $('fixo').innerHTML='';
  $('busca').oninput = e=>{ S.filtro = e.target.value; renderGrade(); };
  $('formBusca').onsubmit = e=>{ e.preventDefault(); enviarBusca(); };
  renderGrade();
}
function renderGrade(){
  const f = norm(S.filtro);
  $('pulos').style.display = f ? 'none' : '';
  let h = '';
  if(f){
    const achados = S.itens.filter(i=>norm(i.nome).includes(f));
    const exato = achados.some(i=>norm(i.nome)===f);
    h = `<div class="grade">${achados.map(tile).join('')}${exato?'':`<button class="item criar" data-criar="1"><span class="e">🛒</span><span class="nm">Criar “${esc(S.filtro.trim())}”</span><span class="tag">produto novo</span></button>`}</div>`;
  } else {
    const grupos = S.categorias.map(c=>({id:c.id, nome:`${c.ic} ${esc(c.nome)}`, its:S.itens.filter(i=>i.cat===c.id)}));
    grupos.push({id:'semcat', nome:'Sem categoria', its:S.itens.filter(i=>!i.cat || !S.categorias.some(c=>c.id===i.cat))});
    for(const g of grupos){ if(!g.its.length) continue;
      h += `<div class="grupo" id="g-${g.id}"><h3>${g.nome}</h3><div class="grade">${g.its.map(tile).join('')}</div></div>`; }
  }
  $('gradeCasa').innerHTML = h;
}
function enviarBusca(){
  const txt = S.filtro.trim();
  if(!txt){ aviso('Escreva o que acabou. Ex.: maizena'); return; }
  const achou = S.itens.find(i=>norm(i.nome)===norm(txt));
  if(achou){ S.filtro=''; if(!achou.falta) tocarItem(achou.id); else { aviso(`${achou.nome} já está na lista`); render(); } return; }
  const nome = txt.charAt(0).toUpperCase()+txt.slice(1);
  const cor = {}; S.mercados.forEach(m=>cor[m.id]=null);
  itemSheet({nome, ic:'🛒', cat:null, cor, vmerc:S.mercado}, true);
}

/* pulo de categoria: vai direto, sem animação de rolagem (a animação "descia e subia" no iPhone por causa da barra fixa) */
function pular(id){
  const g = $('g-'+id), c = $('conteudo'); if(!g) return;
  c.scrollTop += g.getBoundingClientRect().top - c.getBoundingClientRect().top - $('pulos').offsetHeight - 6;
}

/* ---------- Mercado ---------- */
function linhaMercado(i, modo, m){
  const sub = i.chegou ? `<small class="chegada">acabou de entrar · ${esc(i.quem)}</small>` : '';
  if(modo==='prev') return `<div class="linha prev"><span class="ck"></span><span class="e">${i.ic}</span><span class="tx"><b>${esc(i.nome)}</b>${precoTag(i,m)}</span></div>`;
  if(modo==='carrinho') return `<div class="linha no-carrinho" data-pick="${i.id}" role="button" tabindex="0"><span class="ck">✓</span><span class="e">${i.ic}</span><span class="tx"><b>${esc(i.nome)}</b><small>toque para desfazer</small></span><button class="qual" data-anotar="${i.id}" aria-label="Anotar preço de ${esc(i.nome)}">R$</button></div>`;
  if(modo==='sem') return `<button class="linha sem" data-volta="${i.id}"><span class="ck"></span><span class="e">${i.ic}</span><span class="tx"><b>${esc(i.nome)}</b><small>fica para a próxima · toque se achou</small></span></button>`;
  const qual = corredorDe(i, m) ? '' : `<button class="qual" data-qual="${i.id}">qual corredor?</button>`;
  return `<div class="linha pick ${i.chegou?'chegou':''}" data-pick="${i.id}" role="button" tabindex="0"><span class="ck"></span><span class="e">${i.ic}</span><span class="tx"><b>${esc(i.nome)}</b>${sub||precoTag(i,m)}</span>${qual}<button class="nt" data-nt="${i.id}">não tinha</button></div>`;
}

/* ---------- preços: cada anotação = produto + marca + preço + embalagem + mercado + quando ---------- */
const DIAS_VALE = 7;   /* comparação "mais barato" só usa preços de até 7 dias */
const reais = v => 'R$ ' + v.toFixed(2).replace('.', ',');
function lerValor(t){
  const m = String(t).match(/\d+(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:\.\d{1,2})?/); if(!m) return null;
  let s = m[0]; if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const v = parseFloat(s); return v>0 && v<100000 ? v : null;
}
/* todas as medidas da embalagem: "20 un" · "500 g" → 0,5 kg · "6 x 500 ml" → 3 L · "5 un ~400 g" → 5 un E 0,4 kg · "/kg" → 1 kg */
function lerMedidas(t){
  const n = norm(t).replace(/~/g,' '); const out = [];
  if(/\/\s*kg\b/.test(n)) out.push({q:1, un:'kg'});
  if(/\/\s*l\b/.test(n)) out.push({q:1, un:'L'});
  const dz = n.match(/(\d+)?\s*(duzias?|\bdz\b)/); if(dz) out.push({q:12*(dz[1]?+dz[1]:1), un:'un'});
  const re = /(?:(\d+)\s*x\s*)?(\d+(?:[.,]\d+)?)\s*(un|unid\w*|kg|g|l|ml)\b/g; let m;
  while((m = re.exec(n))){
    const vezes = m[1] ? +m[1] : 1; let q = parseFloat(m[2].replace(',','.')) * vezes; let un = m[3];
    if(un==='g'){ q/=1000; un='kg'; } else if(un==='ml'){ q/=1000; un='L'; } else if(un==='l') un='L'; else if(un!=='kg') un='un';
    if(q>0 && !out.some(x=>x.un===un)) out.push({q, un});
  }
  return out;
}
const lerEmb = t => lerMedidas(t)[0] || null;
/* preço por unidade numa unidade dada (kg, L ou un), se a embalagem disser */
const porUnEm = (p, un) => { const e = lerMedidas(p.emb||'').find(x=>x.un===un); return e ? p.valor/e.q : null; };
const porUn = p => { const e = lerEmb(p.emb||''); return e ? {v:p.valor/e.q, un:e.un} : null; };
const quandoTx = d => d===0 ? 'hoje' : d===1 ? 'ontem' : `há ${d} dias`;
/* o preço mais novo de cada mercado para um produto, e qual está mais barato (por unidade quando dá para comparar) */
function comparar(itemId){
  const por = {};
  S.precos.filter(p=>p.item===itemId).forEach(p=>{ if(!por[p.merc] || p.dias<=por[p.merc].dias) por[p.merc] = p; });
  const valem = Object.values(por).filter(p=>p.dias<=DIAS_VALE && merc(p.merc));
  let melhor = null;
  if(valem.length>=2){
    /* compara pela 1ª unidade que TODOS têm (peso/volume antes de unidade); se não houver, pelo preço cheio */
    const un = ['kg','L','un'].find(u=>valem.every(p=>porUnEm(p,u)!==null));
    const custo = p => un ? porUnEm(p,un) : p.valor;
    melhor = valem.reduce((a,p,k)=> a===null || custo(p) < custo(valem[a]) ? k : a, null);
    melhor = valem[melhor].merc;
  }
  return {por, melhor};
}
const txtPreco = p => `${reais(p.valor)}${p.emb?` (${esc(p.emb)})`:''}`;
function precoTag(i, m){
  const c = comparar(i.id); const aqui = c.por[m.id];
  if(!c.melhor) return aqui && aqui.dias<=DIAS_VALE ? `<small class="preco">${txtPreco(aqui)} aqui</small>` : '';
  if(c.melhor===m.id) return `<small class="preco">${txtPreco(aqui)} aqui · mais barato</small>`;
  return `<small class="preco outro">mais barato no ${esc(merc(c.melhor).nome)}: ${txtPreco(c.por[c.melhor])}</small>`;
}
const maisBaratoNoOutro = (i, m) => { const c = comparar(i.id); return !!(c.melhor && c.melhor!==m.id); };
function gruposDe(m, itens){
  const g = m.corredores.map((c,k)=>({titulo:`<span class="num">${k+1}</span><span><small>Corredor ${k+1}</small>${c.ic} ${esc(c.nome)}</span>`, its:itens.filter(i=>corredorDe(i,m)===c.id)}));
  g.push({titulo:`<span class="num">?</span><span>Sem corredor no ${esc(m.nome)}</span>`, its:itens.filter(i=>!corredorDe(i,m))});
  return g.filter(x=>x.its.length);
}
function telaMercado(){
  const m = atual();
  const lista = faltando();
  const pendTodos = lista.filter(i=>!i.carrinho && !i.sem);
  const pend = pendTodos;
  const outros = pendTodos.filter(i=>maisBaratoNoOutro(i,m));
  const com = gruposDe(m, pend);
  let h = '';
  if(!S.comprando){
    $('subtitulo').textContent = `Na ordem do ${m.nome}`;
    h += `<div class="resumo">
      <div class="mercs" role="group" aria-label="Qual mercado">${S.mercados.map(x=>`<button class="merc ${x.id===m.id?'on':''}" data-merc="${x.id}">${x.ic} ${esc(x.nome)}</button>`).join('')}</div>
      <div class="grande">${pend.length} itens em ${com.filter(g=>!g.titulo.includes('Sem corredor')).length} corredores</div>
      ${outros.length?`<div class="onde">🏷️ ${outros.length} ${outros.length===1?'item está mais barato':'itens estão mais baratos'} em outro mercado</div>`:''}
      <button id="comecar">Estou no ${esc(m.nome)}</button></div>`;
  } else {
    const feitos = lista.filter(i=>i.carrinho).length;
    $('subtitulo').textContent = `${m.ic} ${m.nome} · ${feitos} de ${lista.length} no carrinho`;
    h += `<div class="aovivo"><i></i>A Ana vê que você está no ${esc(m.nome)}</div><div class="barra"><i style="width:${lista.length?feitos/lista.length*100:0}%"></i></div>`;
  }
  com.forEach(g=>{ h += `<div class="secao"><h3>${g.titulo}</h3><div class="linhas">${g.its.map(i=>linhaMercado(i, S.comprando?'pick':'prev', m)).join('')}</div></div>`; });
  if(S.comprando){
    const car = lista.filter(i=>i.carrinho), sem = lista.filter(i=>i.sem);
    if(!pendTodos.length) h += `<p class="explica" style="text-align:center">Tudo pego! Toque em Terminar compras.</p>`;
    if(car.length) h += `<div><div class="rotulo-grupo">No carrinho (${car.length}) · toque em R$ para anotar o preço</div><div class="linhas">${car.map(i=>linhaMercado(i,'carrinho',m)).join('')}</div></div>`;
    if(sem.length) h += `<div><div class="rotulo-grupo">Não tinha (${sem.length})</div><div class="linhas">${sem.map(i=>linhaMercado(i,'sem',m)).join('')}</div></div>`;
    h += `<div style="height:70px"></div>`;
    $('fixo').innerHTML = `<div class="fixo"><button id="terminar">Terminar compras</button></div>`;
  } else {
    if(lista.length) h += `<button class="novo" data-tab="precos">🏷️ Comparar os preços da lista</button>`;
    $('fixo').innerHTML='';
  }
  $('conteudo').innerHTML = h;
}

function cartaoPreco(i){
  const c = comparar(i.id);
  const linhas = S.mercados.map(m=>{
    const p = c.por[m.id];
    if(!p) return `<div class="pl"><span class="pm">${m.ic} ${esc(m.nome)}</span><span class="pv vazio-p">sem preço</span></div>`;
    const u = porUn(p); const velho = p.dias>DIAS_VALE;
    return `<div class="pl ${c.melhor===m.id?'melhor':''} ${velho?'velho':''}"><span class="pm">${m.ic} ${esc(m.nome)}</span>
      <span class="pv"><span><b>${reais(p.valor)}</b>${p.emb?` · ${esc(p.emb)}`:''}${u&&p.emb&&!/^1 ?(kg|l)$/i.test(p.emb.trim())?` · ${reais(u.v)}/${u.un}`:''}</span>
      <small>${p.marca?esc(p.marca)+' · ':''}${quandoTx(p.dias)} · ${esc(p.fonte)}${velho?' · antigo, não entra na comparação':''}</small></span>
      ${c.melhor===m.id?'<span class="selo">mais barato</span>':''}</div>`;
  }).join('');
  return `<div class="cor cartao-preco"><div class="l1"><span class="e" style="font-size:26px">${i.ic}</span><span class="nm"><b style="font-size:17px">${esc(i.nome)}</b></span><button class="qual" data-anotar="${i.id}">+ preço</button></div>${linhas}</div>`;
}

/* ---------- colar a resposta do Claude: o app lê o bloco ACABOU e vira anotações de preço ---------- */
function lerResposta(txt){
  const linhas = String(txt).slice(0, 20000).split(/\r?\n/);
  const k = linhas.findIndex(l => /^[\s*#>_`-]*ACABOU[\s*:_`]*$/i.test(l));
  if(k<0) return null;
  const novos = [];
  const achaMerc = t => S.mercados.find(m=>norm(t).includes(norm(m.nome)) || norm(m.nome).includes(norm(t)));
  for(const l of linhas.slice(k+1, k+1+200)){
    if(!l.includes('|')) continue;
    const partes = l.split('|').map(p=>p.replace(/[*_`]/g,'').trim());
    const nome = norm(partes[0].replace(/^[-•\d.)\s]+/,''));
    const i = S.itens.find(x=>norm(x.nome)===nome) || faltando().find(x=>nome && (norm(x.nome).includes(nome) || nome.includes(norm(x.nome))));
    if(!i) continue;
    for(const parte of partes.slice(1)){
      const dp = parte.indexOf(':'); if(dp<0) continue;
      const m = achaMerc(parte.slice(0,dp)); const val = parte.slice(dp+1).trim();
      if(!m || /nao achei/.test(norm(val))) continue;
      const antes = val.split('(')[0]; const v = lerValor(antes); if(!v) continue;
      const dentro = (val.match(/\(([^)]*)\)/)||[])[1] || '';
      const pedacos = dentro.split(/,(?!\d)/).map(x=>x.trim()).filter(Boolean); /* "1,3 kg" não é separador */
      let emb = /\/\s*(kg|l)\b/i.test(antes) ? '1 ' + antes.match(/\/\s*(kg|l)\b/i)[1].replace('l','L') : '';
      const marca = [];
      pedacos.forEach(x=>{ if(!emb && lerEmb(x)) emb = x; else marca.push(x); });
      novos.push({id:novoId('p'), item:i.id, valor:v, emb:emb.slice(0,20), marca:marca.join(', ').slice(0,40), merc:m.id, dias:0, fonte:'Claude'});
    }
  }
  return novos;
}

  const cors = mv.corredores.map(x=>`<button class="chip ${x.id===d.cor[mv.id]?'sel':''}" data-fcor="${x.id}">${x.ic} ${esc(x.nome)}</button>`).join('');
  folha(`<h2>${novo?'Produto novo':'Editar produto'}</h2>
    <div class="campo-item"><button class="emo" id="fEmo" aria-label="Trocar figurinha">${d.ic}</button><input type="text" id="fNome" value="${esc(d.nome)}" aria-label="Nome"></div>
    <div class="rot">Onde fica em casa?</div><div class="chips">${cats}</div>
    <div class="rot">Em que corredor?</div>
    <div class="mini">${S.mercados.map(x=>`<button data-fmerc="${x.id}" class="${x.id===mv.id?'on':''}">${x.ic} ${esc(x.nome)}</button>`).join('')}</div>
    <div class="chips">${cors}</div>
    <button class="ok" id="fSalvar">${novo?'Salvar e pôr na lista':'Salvar'}</button>
    ${novo?'<button class="cancela" id="fCancela">Cancelar</button>':'<button class="link" id="fApagar">Apagar este produto</button>'}`, ()=>{
    const pega = ()=>{ d.nome = $('fNome').value.trim() || d.nome; };
    $('fEmo').onclick = ()=>{ pega(); escolherEmoji(d.ic, e=>{ d.ic=e; itemSheet(d, novo); }); };
    document.querySelectorAll('[data-fcat]').forEach(b=>b.onclick=()=>{ pega(); d.cat=b.dataset.fcat; itemSheet(d, novo); });
    document.querySelectorAll('[data-fmerc]').forEach(b=>b.onclick=()=>{ pega(); d.vmerc=b.dataset.fmerc; itemSheet(d, novo); });
    document.querySelectorAll('[data-fcor]').forEach(b=>b.onclick=()=>{ pega(); d.cor={...d.cor,[mv.id]:b.dataset.fcor}; itemSheet(d, novo); });
    $('fSalvar').onclick = ()=>{
      pega(); fecharFolha();
      if(novo){
        const i = {id:novoId('n'), nome:d.nome, ic:d.ic, cat:d.cat, cor:d.cor, falta:false, carrinho:false, sem:false, chegou:false};
        S.itens.push(i); marcar(i,'Victor','agora'); S.filtro='';
        aviso(`${i.nome} entrou na lista e virou botão`); render();
      } else {
        Object.assign(item(d.id), {nome:d.nome, ic:d.ic, cat:d.cat, cor:d.cor});
        aviso(`${d.nome} salvo`); render();
      }
    };
    if(novo) $('fCancela').onclick = fecharFolha;
    else $('fApagar').onclick = ()=>confirmar(`Apagar ${esc(d.nome)}?`, 'Ele some dos botões e da lista. Dá para criar de novo depois.', 'Apagar', ()=>{
      S.itens = S.itens.filter(i=>i.id!==d.id); aviso(`${d.nome} apagado`); render(); });
  });
}
function qualSheet(id){
  const i = item(id), m = atual();
  folha(`<h2>Onde fica ${esc(i.nome)} no ${esc(m.nome)}?</h2>
    <p>Fica salvo para as próximas compras lá. No ${S.mercados.filter(x=>x.id!==m.id).map(x=>esc(x.nome)).join(' e no ')} não muda nada.</p>
    <div class="chips">${m.corredores.map((c,k)=>`<button class="chip" data-qc="${c.id}">${k+1}. ${c.ic} ${esc(c.nome)}</button>`).join('')}</div>
    <button class="cancela" id="fCancela">Agora não</button>`, ()=>{
    $('fCancela').onclick = fecharFolha;
    document.querySelectorAll('[data-qc]').forEach(b=>b.onclick=()=>{
      const antes = i.cor[m.id]; i.cor[m.id] = b.dataset.qc; fecharFolha(); checar('qual');
      const c = m.corredores.find(x=>x.id===b.dataset.qc);
      aviso(`${i.nome}: ${c.nome}`, 'Desfazer', ()=>{ i.cor[m.id] = antes; }); render();
    });
  });
}

/* ---------- ações ---------- */
function marcar(i, quem, hora){ i.falta=true; i.quem=quem; i.hora=hora; i.carrinho=false; i.sem=false; }
function tocarItem(id){
  const i = item(id);
  if(i.falta){
    i.falta=false; i.carrinho=false; i.sem=false;
    aviso(`${i.nome} saiu da lista`, 'Desfazer', ()=>marcar(i,'Victor','agora'));
  } else {
    marcar(i,'Victor','agora');
    aviso(`${i.nome} entrou na lista`, 'Desfazer', ()=>{ i.falta=false; });
  }
  render();
}
function mover(id, dir){
  const ehCor = S.org==='corredores';
  const m = merc(S.orgMercado);
  const L = ehCor ? m.corredores : S.categorias;
  const k = L.findIndex(x=>x.id===id), j = k+dir;
  if(j<0||j>=L.length) return;
  [L[k],L[j]] = [L[j],L[k]];
  S.mexeu = id; if(ehCor) checar('ordem:'+m.id); render();
  setTimeout(()=>{ if(S.mexeu===id){ S.mexeu=null; document.querySelectorAll('.cor.mexeu').forEach(e=>e.classList.remove('mexeu')); } }, 700);
}
let tAna;
function comecar(){
  S.comprando = true; S.picks = []; S.anaVeio = false; checar('comecar'); render();
  aviso(`A Ana vê que você está no ${atual().nome}`);
}
function anaLembra(){
  if(!S.comprando || S.anaVeio) return;
  const alvo = ['requeijao','iogurte','queijo','manteiga'].map(item).find(i=>i && !i.falta);
  if(!alvo) return;
  S.anaVeio = true;
  marcar(alvo,'Ana','agora'); alvo.chegou = true;
  aviso(`A Ana lembrou: ${alvo.nome}`); render();
  setTimeout(()=>{ alvo.chegou=false; }, 1700);
}
function pegar(id){
  const i = item(id), m = atual();
  i.carrinho = !i.carrinho; i.sem = false; i.chegou = false;
  const c = corredorDe(i, m);
  if(i.carrinho && c && !S.picks.includes(c)) S.picks.push(c);
  checar('pegar'); render();
  if(i.carrinho && !S.anaVeio){ clearTimeout(tAna); tAna = setTimeout(anaLembra, 900); }
}
function semEstoque(id){ const i=item(id); i.sem=true; i.carrinho=false; render(); }
function terminar(){
  const m = atual();
  const lista = faltando();
  const car = lista.filter(i=>i.carrinho), sem = lista.filter(i=>i.sem), resto = lista.filter(i=>!i.carrinho && !i.sem);
  car.forEach(i=>{ i.falta=false; i.carrinho=false; });
  sem.forEach(i=>{ i.sem=false; });
  let aprendeu = '';
  if(m.aprender && S.picks.length>=2){
    const antes = m.corredores.map(c=>c.id).join();
    const posicoes = m.corredores.map((c,k)=>S.picks.includes(c.id)?k:-1).filter(k=>k>=0);
    const novo = m.corredores.slice();
    posicoes.forEach((pos,n)=>{ novo[pos] = m.corredores.find(c=>c.id===S.picks[n]); });
    m.corredores = novo;
    if(novo.map(c=>c.id).join()!==antes) aprendeu = `<p><b>Aprendi a ordem do ${esc(m.nome)}:</b> ${S.picks.map(id=>esc(m.corredores.find(c=>c.id===id).nome)).join(' → ')}.</p>`;
  }
  S.comprando = false; clearTimeout(tAna);
  checar('terminar');
  folha(`<h2>Compras feitas no ${esc(m.nome)}</h2>
    <p>✓ <b>${car.length} ${car.length===1?'item voltou':'itens voltaram'}</b> para "tem em casa".</p>
    ${sem.length?`<p>↻ <b>${sem.map(i=>esc(i.nome)).join(', ')}</b> não tinha: continua na lista.</p>`:''}
    ${resto.length?`<p>• ${resto.length} ${resto.length===1?'item ficou':'itens ficaram'} sem pegar e continuam na lista.</p>`:''}
    ${aprendeu}<button class="ok" id="okFim">Ok</button>`, ()=>$('okFim').onclick=()=>{ fecharFolha(); render(); });
  render();
}

/* ---------- cliques ---------- */
document.addEventListener('click', e=>{
  if(e.target.closest('#folha')) return;
  const t = e.target.closest('button,[data-pick]'); if(!t) return;
  const d = t.dataset;
  if(d.tab){ S.tab = d.tab; S.aberta=null; render(); $('conteudo').scrollTop=0; return; }
  if(d.id){ if(segurou){ segurou=false; return; } tocarItem(d.id); return; }
  if(d.pula){ pular(d.pula); return; }
  if(d.criar){ enviarBusca(); return; }
  if(d.merc){ S.mercado = d.merc; checar('merc:'+d.merc); render(); return; }
  if(d.orgmerc){ S.orgMercado = d.orgmerc; S.aberta=null; render(); return; }
  if(d.qual){ qualSheet(d.qual); return; }
  if(d.anotar){ precoSheet({item:d.anotar, merc:S.comprando?S.mercado:null}); return; }
  if(d.nt){ semEstoque(d.nt); return; }
  if(d.pick){ pegar(d.pick); return; }
  if(d.volta){ item(d.volta).sem=false; render(); return; }
  if(d.orgaba){ S.org = d.orgaba; S.aberta=null; render(); return; }
  if(d.up){ mover(d.up,-1); return; }
  if(d.down){ mover(d.down,1); return; }
  if(d.abre){ S.aberta = S.aberta===d.abre?null:d.abre; render(); return; }
  if(d.edit){ const i=item(d.edit); itemSheet({...i, cor:{...i.cor}, vmerc:S.orgMercado}, false); return; }
  const ehCor = S.org==='corredores', m = merc(S.orgMercado), L = ehCor ? m.corredores : S.categorias;
  if(d.emo){ const x=L.find(y=>y.id===d.emo);
    escolherEmoji(x.ic, em=>{ fecharFolha(); x.ic=em; render(); }); return; }
  if(d.ren){ const x=L.find(y=>y.id===d.ren);
    textoSheet(ehCor?'Nome do corredor':'Nome da categoria', x.nome, 'Salvar', v=>{ x.nome=v; aviso('Nome trocado'); render(); }); return; }
  if(d.del){ const x=L.find(y=>y.id===d.del);
    const its = S.itens.filter(i=> ehCor ? i.cor[m.id]===x.id : i.cat===x.id);
    confirmar(`Apagar ${esc(x.nome)}?`, its.length?`Os ${its.length} produtos daqui vão para "${ehCor?`Sem corredor no ${esc(m.nome)}`:'Sem categoria'}". Nenhum produto some.`:'Não tem nenhum produto aqui.', 'Apagar', ()=>{
      its.forEach(i=>{ if(ehCor) i.cor[m.id]=null; else i.cat=null; });
      if(ehCor) m.corredores = m.corredores.filter(c=>c.id!==x.id); else S.categorias = S.categorias.filter(c=>c.id!==x.id);
      S.aberta=null; aviso(`${x.nome} apagado`); render(); }); return; }
  if(d.novo){
    textoSheet(ehCor?`Novo corredor no ${esc(m.nome)}`:'Nova categoria', '', 'Criar', v=>{
      const x = {id:novoId('x'), nome:v, ic:'🛒'};
      L.push(x); aviso(`${v} criado. Toque na figurinha para trocar.`); render();
      setTimeout(()=>{ const c=$('conteudo'); c.scrollTop=c.scrollHeight; },30); }); return; }
  if(t.id==='novoMerc'){ novoMercadoSheet(); return; }
  if(t.id==='renMerc'){ textoSheet('Nome do mercado', m.nome, 'Salvar', v=>{ m.nome=v; aviso('Nome trocado'); render(); }); return; }
  if(t.id==='delMerc'){
    confirmar(`Apagar o ${esc(m.nome)}?`, 'Somem os corredores dele. Os produtos e a lista continuam iguais, e os outros mercados não mudam.', 'Apagar', ()=>{
      S.mercados = S.mercados.filter(x=>x.id!==m.id); S.itens.forEach(i=>delete i.cor[m.id]);
      if(S.mercado===m.id) S.mercado = S.mercados[0].id; S.orgMercado = S.mercados[0].id;
      aviso(`${m.nome} apagado`); render(); }); return; }
  if(t.id==='comecar'){ comecar(); return; }
  if(t.id==='terminar'){ terminar(); return; }
  if(t.id==='perguntar'){ perguntaSheet(); return; }
  if(t.id==='colar'){ colarSheet(); return; }
  if(t.id==='anotarNovo'){ precoSheet({item:null, merc:null}); return; }
  if(t.id==='recomecar'){ fecharFolha(); clearTimeout(tAna); reset(); render(); return; }
});
/* segurar o dedo num botão de Em casa = editar */
let tSeg=null, segurou=false, x0=0, y0=0;
document.addEventListener('pointerdown', e=>{
  const t = e.target.closest('.item[data-id]'); if(!t) return;
  segurou=false; x0=e.clientX; y0=e.clientY; t.classList.add('segurando');
  tSeg = setTimeout(()=>{ tSeg=null; segurou=true; t.classList.remove('segurando'); navigator.vibrate?.(15);
    const i = item(t.dataset.id); itemSheet({...i, cor:{...i.cor}, vmerc:S.mercado}, false); }, 550);
});
function soltar(){ clearTimeout(tSeg); tSeg=null; document.querySelectorAll('.segurando').forEach(el=>el.classList.remove('segurando')); }
document.addEventListener('pointerup', soltar);
document.addEventListener('pointercancel', soltar);
document.addEventListener('pointermove', e=>{ if(tSeg && Math.hypot(e.clientX-x0, e.clientY-y0)>10) soltar(); });
document.addEventListener('contextmenu', e=>{ if(e.target.closest('.item')) e.preventDefault(); });
document.addEventListener('keydown', e=>{
  const t = e.target.closest?.('[data-pick]');
  if(t && (e.key==='Enter'||e.key===' ') && !e.target.closest('button')){ e.preventDefault(); pegar(t.dataset.pick); }
});
window.addEventListener('resize', posicionar);

reset(); render();
</script>
